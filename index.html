<style>
:root{
  --jade:#0F4C4A; --jade-2:#16625F; --brass:#B8893B; --brass-soft:#E9D9B4;
  --red:#A8392C; --bg:#ECF1EC; --card:#FFFFFF; --ink:#1A2422; --muted:#5E6E6A; --line:#D3DDD7;
  --chip:#E1EAE4; --done:#9AA8A3;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --jade:#0B3634; --jade-2:#1E7470; --brass:#D2A957; --brass-soft:#4A3E25;
    --red:#E0715F; --bg:#0E1615; --card:#17221F; --ink:#E7EEEA; --muted:#9BAAA5; --line:#2A3833;
    --chip:#1F2C29; --done:#5B6965; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --jade:#0B3634; --jade-2:#1E7470; --brass:#D2A957; --brass-soft:#4A3E25;
  --red:#E0715F; --bg:#0E1615; --card:#17221F; --ink:#E7EEEA; --muted:#9BAAA5; --line:#2A3833;
  --chip:#1F2C29; --done:#5B6965; color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--jade)}
.serif{font-family:"Noto Serif TC","Songti TC",serif}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}

/* hero */
.hero{background:var(--jade);color:#F4EEDD;margin:0 -16px;padding:22px 20px 0;position:relative;overflow:hidden}
.hero h1{font-family:"Noto Serif TC","Songti TC",serif;font-weight:900;font-size:34px;line-height:1.15;margin:0;letter-spacing:.04em}
.hero .sub{margin:6px 0 0;color:#CFE0DA;font-size:14px}
.hero .who{font-size:13px;color:#CFE0DA;margin-top:2px}
.deco{display:block;width:100%;height:84px;margin-top:14px}
.count{display:flex;align-items:baseline;gap:10px;margin-top:16px}
.count b{font-family:"Noto Serif TC",serif;font-size:64px;line-height:1;color:var(--brass);font-weight:900}
.count span{font-size:15px;color:#E6DCC2}
.test{display:inline-block;font-size:12px;border:1px solid #C9A24E;color:#E6D2A0;border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:middle}

/* flights */
.flights{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.flt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;position:relative}
.flt .tag{font-size:12px;font-weight:700;color:var(--jade-2)}
.flt.back .tag{color:var(--red)}
.flt .no{position:absolute;right:12px;top:12px;font-size:12px;color:var(--muted)}
.flt .t{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.flt .t strong{font-size:22px;font-variant-numeric:tabular-nums}
.flt .ap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.flt .d{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}

.block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.block h3{margin:0 0 6px;font-size:15px;font-family:"Noto Serif TC",serif}
.hotel a.name{font-weight:700;text-decoration:none;border-bottom:1px solid var(--brass)}
.small{font-size:13px;color:var(--muted)}
.maps{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:6px 10px;border-radius:999px;background:var(--chip);color:var(--ink);text-decoration:none;border:0;cursor:pointer;font-family:inherit}
.btn.g{background:var(--jade-2);color:#fff}
.wx{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.wx div{text-align:center;background:var(--chip);border-radius:10px;padding:6px 2px;font-size:12px}
.wx .i{font-size:20px;line-height:1.4}
.wx .tmp{font-variant-numeric:tabular-nums}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:14px -16px 0;padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 16px;font-size:15px;font-family:inherit;cursor:pointer}
.tab[aria-selected="true"]{background:var(--jade);border-color:var(--jade);color:#F4EEDD}
.tab:focus-visible,.btn:focus-visible,.day:focus-visible,.chk:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

/* days */
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.day{border:0;background:none;padding:6px 0;cursor:pointer;font-family:inherit;color:var(--muted);text-align:center}
.day .n{display:block;font-family:"Noto Serif TC",serif;font-weight:900;font-size:20px;color:var(--ink)}
.day .p{font-size:12px}
.day[aria-selected="true"]{color:var(--jade-2)}
.day[aria-selected="true"] .n{color:var(--brass);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.prog{height:4px;background:var(--line);border-radius:4px;margin:10px 0 4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brass);transition:width .3s}
.dayhead h2{font-family:"Noto Serif TC",serif;font-size:21px;margin:10px 0 2px}

.tl{list-style:none;margin:12px 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:52px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:44px 20px 1fr;gap:8px;padding:0 0 14px}
.tl time{font-size:13px;font-weight:700;color:var(--jade-2);font-variant-numeric:tabular-nums;padding-top:12px;text-align:right}
.chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--brass);background:var(--bg);margin-top:13px;cursor:pointer;padding:0;position:relative;z-index:1}
.chk[aria-pressed="true"]{background:var(--brass)}
.chk[aria-pressed="true"]::after{content:"✓";color:#fff;font-size:12px;position:absolute;inset:0;display:grid;place-items:center}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item .tt{font-weight:700}
.item .k{font-size:12px;color:var(--brass);font-weight:700;margin-right:6px}
.item p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.done .item{opacity:.55}
.done .tt{text-decoration:line-through;text-decoration-color:var(--done)}

.list{list-style:none;padding:0;margin:10px 0 0}
.list li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.list .tt{font-weight:700}
.list p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.notes h3{font-family:"Noto Serif TC",serif;font-size:16px;margin:16px 0 6px}
.notes ul{margin:0;padding-left:20px}
.notes li{margin-bottom:4px}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.status{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.msg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px}
.skel{height:120px;border-radius:14px;background:var(--chip);margin-top:12px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1 id="title">行程</h1>
    <p class="sub"><span id="dates"></span> <span class="test" id="testtag" hidden></span></p>
    <p class="who" id="who"></p>
    <div class="count" id="count"></div>
    <svg class="deco" viewBox="0 0 400 84" preserveAspectRatio="none" aria-hidden="true">
      <g fill="none" stroke="#C9A24E" stroke-width="1.5">
        <path d="M200 84 A80 80 0 0 1 360 84"/><path d="M220 84 A60 60 0 0 1 340 84"/><path d="M240 84 A40 40 0 0 1 320 84"/>
        <path d="M40 84 A80 80 0 0 1 200 84"/><path d="M60 84 A60 60 0 0 1 180 84"/><path d="M80 84 A40 40 0 0 1 160 84"/>
        <path d="M-120 84 A80 80 0 0 1 40 84"/><path d="M360 84 A80 80 0 0 1 520 84"/>
      </g>
      <g fill="#C9A24E" opacity=".9">
        <rect x="276" y="22" width="4" height="62"/><circle cx="278" cy="34" r="7"/><circle cx="278" cy="54" r="4"/><rect x="277" y="6" width="2" height="18"/>
      </g>
    </svg>
  </header>
  <div id="app"><div class="skel"></div><div class="skel"></div></div>
  <p class="status" id="status"></p>
  <p class="foot">航班與店家資訊請以實際預訂為準。<br><button class="btn" id="reset" style="margin-top:8px">清除打勾紀錄</button></p>
</div>

<script>
/* ====== 只需要改這一行：貼上 Apps Script 部署後的網址（結尾是 /exec） ====== */
const API_URL = "https://script.google.com/macros/s/AKfycbzMPqAtUmAZAObPEfp_CJ4VhVgFhxhlHMxJYTbxqw5Fx6bnSahSGg7QNeqwqAHo2WA9/exec";
/* ========================================================================== */

const CACHE_KEY="trip-data", CHECK_KEY="trip-check", TAB_KEY="trip-tab";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gUrl=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const aUrl=q=>"https://uri.amap.com/search?keyword="+encodeURIComponent(q);
const mapBtns=q=>q?`<div class="maps"><a class="btn g" href="${gUrl(q)}" target="_blank" rel="noopener">Google 地圖</a><a class="btn" href="${aUrl(q)}" target="_blank" rel="noopener">高德地圖</a></div>`:"";
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const mins=t=>{const m=String(t).match(/(\d{1,2})[:：](\d{2})/);return m?(+m[1])*60+(+m[2]):9999};

let D=null, state=ls.get(CHECK_KEY,{}), tab=ls.get(TAB_KEY,"plan"), day=null;

function cfg(k){const r=(D["設定"]||[]).find(x=>x["項目"]===k);return r?r["內容"]:""}

function renderShell(){
  document.title=(cfg("標題")||"行程")+"｜行程";
  $("title").textContent=cfg("標題")||"行程";
  $("dates").textContent=cfg("日期說明");
  const tt=cfg("測試標記"); $("testtag").hidden=!tt; $("testtag").textContent=tt;
  $("who").textContent=cfg("旅客")?"旅客："+cfg("旅客"):"";
  const sd=cfg("出發日期").match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);
  const days=(D["每日"]||[]).length||1;
  if(sd){
    const start=new Date(+sd[1],+sd[2]-1,+sd[3]);
    const n=Math.round((start-new Date().setHours(0,0,0,0))/864e5);
    $("count").innerHTML=n>0?`<b>${n}</b><span>天後出發</span>`:n>-days?`<b>D${1-n}</b><span>旅程進行中</span>`:`<span>旅程已結束</span>`;
    if(day===null) day=Math.min(Math.max(-n,0),days-1);
  }
  if(day===null) day=0;

  const f=(D["航班"]||[]).map(x=>`<div class="flt ${x["類型"]==="回程"?"back":""}"><span class="tag">${esc(x["類型"])}</span><span class="no">${esc(x["航班"])}</span>
    <div class="t"><strong>${esc(x["起飛時間"])}</strong><strong>${esc(x["抵達時間"])}</strong></div>
    <div class="ap"><span>${esc(x["出發機場"])}</span><span>${esc(x["抵達機場"])}</span></div>
    <div class="d">${esc(x["日期說明"])}</div></div>`).join("");
  const hq=cfg("住宿地圖關鍵字")||cfg("住宿名稱");
  const wx=(D["天氣"]||[]).map(w=>`<div><div>${esc(w["日期"])}</div><div class="i">${esc(w["圖示"])}</div><div class="tmp">${esc(w["溫度"])}</div></div>`).join("");
  $("app").innerHTML=`
  ${f?`<section class="flights" aria-label="航班">${f}</section>`:""}
  ${cfg("住宿名稱")?`<section class="block hotel"><h3>住宿</h3>
    <a class="name" href="${gUrl(hq)}" target="_blank" rel="noopener">${esc(cfg("住宿名稱"))}</a>
    <div class="small">${esc(cfg("住宿說明"))}</div><div class="small">${esc(cfg("住宿時間"))}</div>${mapBtns(hq)}</section>`:""}
  ${wx?`<section class="block"><h3>天氣（往年同期參考）</h3><div class="wx" style="grid-template-columns:repeat(${Math.min((D["天氣"]||[]).length,7)},1fr)">${wx}</div>
    <p class="small" style="margin:8px 0 0">${esc(cfg("天氣說明"))}</p></section>`:""}
  <nav class="tabs" role="tablist" aria-label="分類">
    <button class="tab" role="tab" data-v="plan">行程</button><button class="tab" role="tab" data-v="food">美食</button>
    <button class="tab" role="tab" data-v="shop">購物</button><button class="tab" role="tab" data-v="notes">須知</button>
  </nav>
  <main id="view"></main>`;
  renderView();
}

function renderView(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===tab));
  const v=$("view"); if(!v) return;
  if(tab==="plan"){
    const days=D["每日"]||[]; if(!days.length){v.innerHTML='<p class="small">「每日」分頁還沒有資料。</p>';return}
    day=Math.min(day,days.length-1);
    const cur=days[day], dn=String(cur["天"]);
    const items=(D["行程"]||[]).filter(x=>String(x["天"])===dn).sort((a,b)=>mins(a["時間"])-mins(b["時間"]));
    const key=x=>dn+"|"+x["時間"]+"|"+x["名稱"];
    const done=items.filter(x=>state[key(x)]).length;
    v.innerHTML=`<div class="days" role="tablist" style="grid-template-columns:repeat(${Math.min(days.length,7)},1fr)">${days.map((x,i)=>`<button class="day" role="tab" aria-selected="${i===day}" data-d="${i}"><span class="n">D${esc(x["天"])}</span><span class="p">${esc(x["簡稱"])}</span></button>`).join("")}</div>
    <div class="prog"><i style="width:${items.length?done/items.length*100:0}%"></i></div>
    <div class="small">完成 ${done} / ${items.length}</div>
    <div class="dayhead"><h2>${esc(cur["日期"])} ${esc(cur["標題"])}</h2></div>
    <ol class="tl">${items.map(it=>{const k=key(it),on=!!state[k];return `<li class="${on?"done":""}"><time>${esc(it["時間"])}</time>
      <button class="chk" aria-pressed="${on}" aria-label="標記完成：${esc(it["名稱"])}" data-k="${esc(k)}"></button>
      <div class="item"><div class="tt">${it["類別"]?`<span class="k">${esc(it["類別"])}</span>`:""}${esc(it["名稱"])}</div>${it["說明"]?`<p>${esc(it["說明"])}</p>`:""}${mapBtns(it["地圖關鍵字"]||it["名稱"])}</div></li>`}).join("")}</ol>`;
  } else if(tab==="food"||tab==="shop"){
    const L=D[tab==="food"?"美食":"購物"]||[];
    v.innerHTML=`<ul class="list">${L.map(x=>`<li><div class="tt">${esc(x["名稱"])}</div><p>${esc(x["說明"])}</p>${mapBtns(x["地圖關鍵字"]||x["名稱"])}</li>`).join("")}</ul>`;
  } else {
    const groups={};(D["須知"]||[]).forEach(x=>{(groups[x["分類"]||"其他"]=groups[x["分類"]||"其他"]||[]).push(x["內容"])});
    v.innerHTML=`<div class="notes">${Object.keys(groups).map(g=>`<h3>${esc(g)}</h3><ul>${groups[g].map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`).join("")}</div>`;
  }
}

function setStatus(t){$("status").textContent=t}
function fmt(iso){const d=new Date(iso);return isNaN(d)?"":`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}

async function load(){
  const cached=ls.get(CACHE_KEY,null);
  if(cached){D=cached;renderShell();setStatus("資料更新中…")}
  if(!/^https:\/\/script\.google\.com\//.test(API_URL)){
    $("app").innerHTML='<div class="msg"><b>還沒設定資料來源</b><p class="small">請把 Apps Script 部署後的網址，貼到 index.html 裡的 API_URL 那一行。</p></div>';setStatus("");return}
  try{
    const r=await fetch(API_URL,{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const data=await r.json();
    D=data;ls.set(CACHE_KEY,data);renderShell();setStatus("資料更新時間 "+fmt(data.updated));
  }catch(e){
    if(cached) setStatus("目前無法連線，顯示上次儲存的資料");
    else {$("app").innerHTML='<div class="msg"><b>讀取資料失敗</b><p class="small">請確認網路連線，或檢查 Apps Script 的部署設定是否為「所有人」都能存取。</p></div>';setStatus("")}
  }
}

document.addEventListener("click",e=>{
  const t=e.target.closest(".tab");if(t){tab=t.dataset.v;ls.set(TAB_KEY,tab);renderView();return}
  const d=e.target.closest(".day");if(d){day=+d.dataset.d;renderView();return}
  const c=e.target.closest(".chk");if(c){const k=c.dataset.k;state[k]=!state[k];if(!state[k])delete state[k];ls.set(CHECK_KEY,state);renderView();return}
  if(e.target.id==="reset"){state={};ls.set(CHECK_KEY,state);if(D)renderView()}
});
load();
</script>
</body>
</html>
