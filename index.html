<title>行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --ink:#33404B; --muted:#6B7580; --soft:#B4BBC2; --line:#EDEFF2;
  --blue:#6F8DAA; --blue-ink:#4F6D8A; --blue-soft:#EEF3F7; --on-blue:#FFFFFF;
  --hero:#4A6784; --pink:#C98F96; --pink-soft:#FAF0F1; --pink-line:#F0D9DC; --card:#FFFFFF; --shadow:0 1px 2px rgba(54,66,77,.06),0 4px 14px rgba(54,66,77,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E2329; --ink:#E6E8EA; --muted:#A9B1B9; --soft:#5E6872; --line:#2E353C;
    --blue:#93AECA; --blue-ink:#B3C8DD; --blue-soft:#26303A; --on-blue:#1E2329;
    --hero:#2F4559; --pink:#E2B1B7; --pink-soft:#4A3A40; --pink-line:#5A474D; --card:#252B31; --shadow:none; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E2329; --ink:#E6E8EA; --muted:#A9B1B9; --soft:#5E6872; --line:#2E353C;
  --blue:#93AECA; --blue-ink:#B3C8DD; --blue-soft:#26303A; --on-blue:#1E2329;
  --hero:#2F4559; --pink:#E2B1B7; --pink-soft:#4A3A40; --pink-line:#5A474D; --card:#252B31; --shadow:none; color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hero)}
a{color:inherit} button{font-family:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* hero */
.hero{background:var(--hero);color:#fff;padding:22px 22px 20px;border-radius:0 0 28px 28px}
.hero .dates{font-size:13px;color:rgba(255,255,255,.75);margin:0}
.hero h1{margin:4px 0 0;font-size:30px;font-weight:500;letter-spacing:.04em;line-height:1.25}
.hero .when{margin:6px 0 0;font-size:14px;color:rgba(255,255,255,.9)}
.hero .when b{font-size:20px;font-weight:500;margin:0 3px}
.hero .who{font-size:13px;color:rgba(255,255,255,.75)}
.tag{display:inline-block;font-size:11px;color:#fff;background:rgba(255,255,255,.18);border-radius:999px;padding:0 8px;margin-left:6px;vertical-align:2px}
.flights{margin-top:14px;background:var(--card);color:var(--ink);border-radius:16px;padding:4px 14px;box-shadow:var(--shadow)}
.fl{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;padding:9px 0;font-size:14px}
.fl+.fl{border-top:1px solid var(--line)}
.fl .k{font-size:12px;color:var(--blue-ink);background:var(--blue-soft);border-radius:6px;text-align:center;padding:1px 0}
.fl.back .k{color:var(--pink);background:var(--pink-soft)}
.fl .rt{font-variant-numeric:tabular-nums}
.fl .rt{line-height:1.35}
.fl .rt b{font-weight:500;font-size:16px}
.fl .rt .ap{display:block;color:var(--muted);font-size:12px}
.fl .rt .ar{color:var(--muted);margin:0 6px}
.fl .no{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.fl .cls{display:block;margin-top:2px;color:var(--blue-ink)}

.hero.compact{padding:16px 22px 14px}
.hero.compact h1{font-size:22px}
.hero.compact .dates{display:none}
.alert{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;background:var(--pink);color:#fff;border-radius:999px;padding:3px 12px 3px 9px}
.alert svg{width:15px;height:15px}
.tr{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:0 0 10px;font-size:13px;color:var(--muted)}
.tr .ct{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.st{font-size:12px;border-radius:999px;padding:0 8px;white-space:nowrap}
.st.ok{background:var(--blue-soft);color:var(--blue-ink)}
.st.no{background:var(--pink);color:#fff}
.st.due{background:var(--pink-soft);color:var(--pink)}
.hotel .pay{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:8px;font-size:14px}
.hotel .pay .lb{color:var(--muted)}
.mapbtn{position:relative}
.mapbtn summary{list-style:none;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--blue-ink);background:var(--blue-soft)}
.mapbtn summary::-webkit-details-marker{display:none}
.mapbtn summary svg{width:17px;height:17px}
.mapbtn .pop{position:absolute;right:0;top:40px;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.12);padding:4px;min-width:130px}
.mapbtn .pop a{display:block;padding:8px 12px;font-size:14px;text-decoration:none;color:var(--ink);border-radius:8px}
.mapbtn .pop a:active{background:var(--blue-soft)}
.body{display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:start}
.body .bd{min-width:0}
.tel{color:var(--blue-ink);text-decoration:none}
.lks{display:flex;gap:14px;margin-top:2px}
.tr .tel{white-space:nowrap}
main{padding:0 20px}

/* day chips */
.days{display:flex;gap:8px;margin:20px -20px 0;padding:0 20px 4px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:62px;border:0;background:transparent;border-radius:16px;padding:8px 6px;text-align:center;cursor:pointer;position:relative}
.day .w{display:block;font-size:12px;color:var(--muted)}
.day .n{display:block;font-size:22px;font-weight:500;line-height:1.2}
.day .p{display:block;font-size:12px;color:var(--muted);white-space:nowrap}
.day[aria-selected="true"]{background:var(--hero);color:#fff}
.day[aria-selected="true"] .w,.day[aria-selected="true"] .p{color:#fff;opacity:.8}
.day .dot{position:absolute;top:7px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--pink)}

.dayhead{margin:18px 0 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.dayhead h2{margin:0;font-size:21px;font-weight:500}
.wchip{display:inline-flex;align-items:center;gap:5px;flex:none;font-size:14px;color:var(--blue-ink);background:var(--blue-soft);border-radius:999px;padding:3px 11px 3px 8px;font-variant-numeric:tabular-nums}
.wchip svg{width:18px;height:18px}
.wchip small{font-size:11px;color:var(--muted)}
.wgrid{display:grid;gap:6px;margin-top:10px}
.wcell{text-align:center;background:var(--blue-soft);border-radius:14px;padding:8px 2px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.wcell svg{width:22px;height:22px;color:var(--blue-ink);display:block;margin:4px auto 2px}
.wcell b{display:block;font-weight:500;color:var(--ink);font-size:14px}
.wcell .rain{color:var(--blue-ink)}
.wcap{font-size:12px;color:var(--muted);margin:6px 0 0}

/* reminder */
.remind{margin-top:14px;background:var(--pink-soft);border-radius:18px;padding:6px 16px}
.rrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.rrow+.rrow{border-top:1px solid var(--pink-line)}
.rrow .ic{color:var(--pink);margin-top:3px}
.rrow .main{flex:1;min-width:0;font-size:15px}
.rrow .main b{font-weight:500}
.rrow .main .nm{display:block;font-weight:500}
.rrow .sub{font-size:13px;color:var(--muted)}
.rrow a.lk{font-size:13px;color:var(--pink);text-decoration:none;white-space:nowrap;margin-top:2px}

/* timeline */
.sec{margin-top:24px}
.sec h3{margin:0 0 4px;font-size:13px;font-weight:500;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0}
.it{display:grid;grid-template-columns:48px 14px 1fr;column-gap:10px}
.it time{font-size:15px;font-weight:500;color:var(--blue-ink);text-align:right;padding-top:11px;font-variant-numeric:tabular-nums}
.it.flex time{font-size:12px;font-weight:400;color:var(--muted);padding-top:13px}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--line)}
.rail::after{content:"";position:absolute;left:1px;top:17px;width:12px;height:12px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px var(--bg)}
.it.flex .rail::after{background:var(--bg);border:2px solid var(--soft)}
.it:first-child .rail::before{top:17px}
.it:last-child .rail::before{bottom:auto;height:17px}
.body{padding:8px 0 14px}
.body .tt{font-weight:500;font-size:16px}
.body .k{font-size:12px;color:var(--muted);margin-left:6px;font-weight:400}
.body p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.resv{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;background:var(--pink-soft);color:var(--ink);border-radius:999px;padding:3px 10px 3px 8px}
.resv svg{color:var(--pink);width:15px;height:15px}
.resv.ok{background:var(--blue-soft)}
.resv.ok svg{color:var(--blue-ink)}
.maps{display:flex;gap:14px;margin-top:4px;font-size:13px}
.maps a{color:var(--blue-ink);text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.maps svg{width:14px;height:14px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--blue);display:inline-block}
.legend i.o{background:transparent;border:2px solid var(--soft)}

/* other pages */
.ptitle{margin:22px 0 0;font-size:21px;font-weight:500}
.list{list-style:none;padding:0;margin:12px 0 0}
.list li{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid var(--line)}
.list .tt{font-weight:500}
.list .k{font-size:12px;color:var(--muted);margin-left:8px;font-weight:400}
.list p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.hotel .when2{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.hotel .when2 span{font-size:13px;background:var(--blue-soft);color:var(--blue-ink);border-radius:999px;padding:2px 10px}
.hotel .when2 span.o{background:var(--pink-soft);color:var(--pink)}
.hotel .addr{font-size:14px;margin-top:8px}
.h3{margin:22px 0 0;font-size:15px;font-weight:500}
.wx{display:grid;gap:6px;margin-top:8px}
.wx div{text-align:center;background:var(--blue-soft);border-radius:12px;padding:6px 2px;font-size:12px;color:var(--muted)}
.wx b{display:block;font-weight:500;color:var(--ink);font-size:14px}
.notes h3{font-size:15px;font-weight:500;margin:20px 0 4px}
.notes ul{margin:0;padding-left:20px}
.notes li{margin-bottom:4px}
.empty{color:var(--muted);font-size:14px;margin-top:14px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--blue-ink)}

/* status & login */
.status{font-size:12px;color:var(--muted);display:flex;justify-content:center;align-items:center;gap:10px;margin:30px 0 4px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer;color:var(--muted)}
.btn.p{background:var(--blue);border-color:var(--blue);color:var(--on-blue);font-size:15px;padding:9px 24px}
.foot{text-align:center;font-size:11px;color:var(--muted);margin:0 0 10px}
.msg{background:var(--blue-soft);border-radius:18px;padding:20px;margin-top:22px}
.msg p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.login{display:grid;gap:12px}
.pwin{font:inherit;font-size:16px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.login .btn{justify-self:start}
.err{color:var(--pink)!important}
.skel{height:120px;border-radius:18px;background:var(--blue-soft);margin-top:16px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero" id="hero">
    <p class="dates" id="dates"></p>
    <h1 id="title">行程</h1>
    <p class="when" id="when"></p>
    <div id="alert"></div>
    <div id="flights"></div>
  </header>
  <main><div id="app"><div class="skel"></div><div class="skel"></div></div>
    <div class="status"><span id="status"></span><button class="btn" id="refresh" type="button" hidden>重新整理</button><button class="btn" id="logout" type="button" hidden>登出</button></div>
    <p class="foot">航班、住宿與訂位請以實際預訂為準</p>
  </main>
</div>
<nav class="tabbar" id="tabbar" hidden role="tablist" aria-label="分類"><div class="in">
  <button class="tab" role="tab" data-v="plan"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>行程</button>
  <button class="tab" role="tab" data-v="stay"><svg class="i" viewBox="0 0 24 24"><path d="M3 19V8M3 15h18v4M21 15v-3a3 3 0 0 0-3-3h-7v6"/><circle cx="7" cy="12" r="1.8"/></svg>住宿</button>
  <button class="tab" role="tab" data-v="list"><svg class="i" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>口袋名單</button>
  <button class="tab" role="tab" data-v="notes"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg>須知</button>
</div></nav>

<script>
/* ====== 資料來源：Apps Script 部署網址（結尾是 /exec） ====== */
const API_URL = "https://script.google.com/macros/s/AKfycbzMPqAtUmAZAObPEfp_CJ4VhVgFhxhlHMxJYTbxqw5Fx6bnSahSGg7QNeqwqAHo2WA9/exec";
/* ========================================================== */

const CACHE_KEY="trip-data", TAB_KEY="trip-tab", PW_KEY="trip-pw";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const gUrl=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const aUrl=q=>"https://uri.amap.com/search?keyword="+encodeURIComponent(q);
const PIN='<svg class="i" viewBox="0 0 24 24"><path d="M12 21s-6-5.5-6-10.5a6 6 0 0 1 12 0C18 15.5 12 21 12 21z"/><circle cx="12" cy="10.5" r="2"/></svg>';
const maps=q=>q?`<div class="maps"><a href="${gUrl(q)}" target="_blank" rel="noopener">${PIN}Google 地圖</a><a href="${aUrl(q)}" target="_blank" rel="noopener">高德地圖</a></div>`:"";
const mapBtn=q=>q?`<details class="mapbtn"><summary aria-label="開啟地圖">${PIN}</summary><div class="pop"><a href="${gUrl(q)}" target="_blank" rel="noopener">Google 地圖</a><a href="${aUrl(q)}" target="_blank" rel="noopener">高德地圖</a></div></details>`:"";
const ICON={

function wIcon(c){c=+c;if(isNaN(c))return WI.temp;if(c===0)return WI.sun;if(c<=2)return WI.part;if(c===3)return WI.cloud;if(c<=48)return WI.fog;if(c<=67||(c>=80&&c<=82))return WI.rain;if(c<=77||c===85||c===86)return WI.snow;return WI.storm}
function wText(c){c=+c;if(c===0)return "晴";if(c<=2)return "晴時多雲";if(c===3)return "陰";if(c<=48)return "有霧";if(c<=57)return "毛毛雨";if(c<=67||(c>=80&&c<=82))return "雨";if(c<=77||c===85||c===86)return "雪";return "雷雨"}
const r0=v=>Math.round(+v);

let D=null, T=null, tab=ls.get(TAB_KEY,"plan"), day=null, lastFetch=0, loading=false;
const S=n=>(D&&D[n])||[];
function cfg(...ks){for(const k of ks){const r=S("設定").find(x=>x["項目"]===k);if(r&&String(r["內容"]||"").trim())return String(r["內容"]).trim()}return ""}

/* ---------- 日期工具：星期幾一律由日期計算 ---------- */
const WK="日一二三四五六";
const DAY=864e5;
const md=d=>`${d.getMonth()+1}/${d.getDate()}`;
const mdw=d=>`${md(d)}（${WK[d.getDay()]}）`;
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
function parseYMD(s){const m=String(s||"").match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null}
/* 「11/18 14:00」「2026/11/18 14:00」「11/18（三）14:00 後」都可以 */
function parseStamp(s,start){
  s=String(s||"");let d=parseYMD(s);let rest=s;
  if(d) rest=s.replace(/\d{4}\D\d{1,2}\D\d{1,2}/,"");
  else{const m=s.match(/(\d{1,2})\/(\d{1,2})/);if(!m)return null;
    d=new Date(start.getFullYear(),+m[1]-1,+m[2]);if(d<start-90*DAY)d.setFullYear(start.getFullYear()+1);
    rest=s.replace(m[0],"");}
  const t=rest.match(/(\d{1,2})[:：](\d{2})/);
  return {date:d,time:t?t[1].padStart(2,"0")+":"+t[2]:""};
}
const hm2m=s=>{const m=String(s||"").match(/(\d{1,2})[:：](\d{2})/);return m?+m[1]*60+(+m[2]):null};
const m2hm=v=>{v=((v%1440)+1440)%1440;return String(Math.floor(v/60)).padStart(2,"0")+":"+String(v%60).padStart(2,"0")};

/* ---------- 由「設定」「住宿」「行程」推算整趟旅程 ---------- */
function buildTrip(){
  const start=parseYMD(cfg("出發日期"));if(!start){T=null;return}
  const end=parseYMD(cfg("回程日期"));
  let n=end?Math.round((end-start)/DAY)+1:Math.max(1,...S("行程").map(x=>+x["天"]||0),S("每日").length);
  n=Math.min(Math.max(n,1),60);
  const hotels=S("住宿").map(h=>({...h,_in:parseStamp(h["入住"],start),_out:parseStamp(h["退房"],start)}));
  const days=[];
  for(let i=0;i<n;i++){
    const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    const hotel=hotels.find(h=>h._in&&h._out&&h._in.date<=d&&d<h._out.date)||null;
    const ov=S("每日").find(r=>String(r["天"])===String(i+1))||{};
    days.push({i,date:d,hotel,ov});
  }
  const lead=parseFloat(cfg("接送提早小時","接送提早"));
  T={start,end:days[n-1].date,n,days,hotels,city:cfg("城市","天氣城市"),lead:isNaN(lead)?null:lead};
}
function todayIndex(){if(!T)return -1;const k=Math.round((today0()-T.start)/DAY);return k>=0&&k<T.n?k:-1}

/* ---------- 接送與住宿付款 ---------- */
const booked=t=>/已/.test(t["預約狀態"]||"")&&!/未/.test(t["預約狀態"]||"");
const trOf=k=>S("接送").find(x=>x["類型"]===k)||null;
const trChip=t=>booked(t)?`<span class="st ok">已預約</span>`:`<span class="st no">尚未預約</span>`;
const trSrc=t=>esc(t["預約來源"]||"");
const safeUrl=u=>/^https?:\/\//i.test(String(u||"").trim())?String(u).trim():"";
function trLinks(t){const tel=String(t["電話"]||"").trim(),u=safeUrl(t["預約網址"]);
  return (tel?`<a class="tel" href="tel:${esc(tel.replace(/[^\d+]/g,""))}">${esc(tel)}</a>`:"")+(u?`<a class="tel" href="${esc(u)}" target="_blank" rel="noopener">預約網頁</a>`:"")}
function payChip(h){const s=String(h["是否已付"]||"").trim();if(!s)return "";
  return s==="已付款"?`<span class="st ok">已付款</span>`:s==="到店付款"?`<span class="st due">到店付款</span>`:`<span class="st no">${esc(s)}</span>`}
const needPay=h=>h&&/未付|到店/.test(h["是否已付"]||"");

/* ---------- 天氣 ---------- */
function wxDay(i){const w=D&&D.weather;return w&&!w.error&&w.days?w.days[i]||null:null}
function wxChip(i){const w=wxDay(i);if(!w||w.max==null)return "";const f=w.kind==="forecast";
  return `<span class="wchip" title="${f?"天氣預報":"往年同期平均"}">${f?wIcon(w.code):WI.temp}${r0(w.min)}–${r0(w.max)}°${f&&w.pop!=null?`<small>${r0(w.pop)}%</small>`:`<small>${f?"":"往年"}</small>`}</span>`}

/* ---------- 每天的項目：試算表的行程 + 自動產生的搭機行程 ---------- */
const apQ=a=>a?`${a} 機場`:"";
function autoItems(i){
  const out=[],F=S("航班");
  if(i===0){const g=F.find(x=>x["類型"]==="去程");
    if(g){const dep=hm2m(g["起飛時間"]);
      if(T.lead!=null&&dep!=null) out.push({"時間":m2hm(dep-T.lead*60),"類別":"交通","名稱":"機場接送上車","說明":`起飛前 ${T.lead} 小時，前往${g["出發機場"]||"機場"}`,_q:apQ(g["出發機場"]),_tr:trOf("去程")});
      out.push({"時間":g["起飛時間"],"類別":"交通","名稱":`${g["航班"]||""} 起飛`,"說明":`${g["出發機場"]||""} → ${g["抵達機場"]||""}${g["艙等"]?`，${g["艙等"]}`:""}`,_q:apQ(g["出發機場"])});
      if(g["抵達時間"]) out.push({"時間":g["抵達時間"],"類別":"交通","名稱":`抵達${g["抵達機場"]||""}`,"說明":"入境、領行李","_q":apQ(g["抵達機場"])});}}
  if(i===T.n-1){const r=F.find(x=>x["類型"]==="回程");
    if(r){const dep=hm2m(r["起飛時間"]),prev=i>0?T.days[i-1].hotel:null;
      if(T.lead!=null&&dep!=null) out.push({"時間":m2hm(dep-T.lead*60),"類別":"交通","名稱":`退房，從${prev?prev["名稱"]:"飯店"}出發去機場`,"說明":`起飛前 ${T.lead} 小時出發，前往${r["出發機場"]||"機場"}`,_q:apQ(r["出發機場"])});
      out.push({"時間":r["起飛時間"],"類別":"交通","名稱":`${r["航班"]||""} 起飛`,"說明":`${r["出發機場"]||""} → ${r["抵達機場"]||""}${r["艙等"]?`，${r["艙等"]}`:""}`,_q:apQ(r["出發機場"])});
      if(r["抵達時間"]) out.push({"時間":r["抵達時間"],"類別":"交通","名稱":`抵達${r["抵達機場"]||""}`,"說明":trOf("回程")?"搭回程接送回家":"","_q":apQ(r["抵達機場"]),_tr:trOf("回程")});}}
  return out;
}
const SECS=[["am","上午"],["pm","下午"],["ev","晚上"],["free","有空再去"]];
function parseTime(t){
  t=String(t||"").trim();const m=t.match(/(\d{1,2})[:：](\d{2})/);
  if(m){const mins=+m[1]*60+(+m[2]);return {fixed:true,mins,sec:mins<720?"am":mins<1080?"pm":"ev",label:m[1].padStart(2,"0")+":"+m[2]}}
  if(/早|上午/.test(t)) return {fixed:false,mins:480,sec:"am",label:t};
  if(/中午|午餐/.test(t)) return {fixed:false,mins:720,sec:"pm",label:t};
  if(/下午/.test(t)) return {fixed:false,mins:780,sec:"pm",label:t};
  if(/傍晚|晚|夜/.test(t)) return {fixed:false,mins:1080,sec:"ev",label:t};
  return {fixed:false,mins:9999,sec:"free",label:""};
}
function dayItems(i){
  const raw=S("行程").filter(x=>String(x["天"])===String(i+1)).concat(autoItems(i));
  let last=0;
  return raw.map((x,k)=>{const p=parseTime(x["時間"]);const key=p.fixed?p.mins:(p.sec==="free"?99999+k:Math.max(last,p.mins)+0.01*(k+1));if(p.fixed)last=p.mins;return {x,p,key}}).sort((a,b)=>a.key-b.key);
}
const cleanName=s=>String(s||"").replace(/^(早餐|午餐|晚餐|宵夜|下午茶)\s*/,"");
function dayInfo(i){
  const ov=T.days[i].ov||{};
  const acts=S("行程").filter(x=>String(x["天"])===String(i+1)&&!/交通|住/.test(x["類別"]||"")).map(x=>cleanName(x["名稱"])).filter(Boolean);
  const title=ov["標題"]||(acts.length?acts.slice(0,3).join("・"):i===0?"出發":i===T.n-1?"返台":`第 ${i+1} 天`);
  const short=ov["簡稱"]||(i===0?"出發":i===T.n-1&&T.n>1?"返台":acts.length?acts[0].slice(0,5):`第 ${i+1} 天`);
  return {title,short};
}

/* ---------- 畫面 ---------- */
function renderShell(){
  buildTrip();
  if(!T){$("app").innerHTML=`<div class="msg"><b>還沒設定出發日期</b><p>請在試算表「設定」分頁填入出發日期（例如 2026-11-18）和回程日期。</p></div>`;return}
  const title=cfg("標題")||`${T.city||"旅程"} ${T.n} 天${T.n>1?` ${T.n-1} 夜`:""}`;
  document.title=title;$("title").textContent=title;
  $("dates").innerHTML=`${T.start.getFullYear()}/${md(T.start)}（${WK[T.start.getDay()]}）– ${md(T.end)}（${WK[T.end.getDay()]}）`;
  const k=Math.round((T.start-today0())/DAY);
  const w=k>1?`還有<b>${k}</b>天出發`:k===1?"明天出發":k>-T.n?`旅程第<b>${1-k}</b>天`:"旅程已結束";
  $("when").innerHTML=w+(cfg("旅客")?`<span class="who">　${esc(cfg("旅客"))}</span>`:"");
  const ti=todayIndex(),showF=ti<0||ti===0||ti===T.n-1;
  const fDate=t=>t==="去程"?mdw(T.start):t==="回程"?mdw(T.end):"";
  const trRow=t=>{const x=trOf(t);if(!x)return "";
    return `<div class="tr"><span></span><span class="ct">${ICON.car}<span>機場接送</span>${trChip(x)}${x["預約來源"]?`<span>${trSrc(x)}</span>`:""}${trLinks(x)}</span></div>`};
  const F=S("航班");
  $("flights").innerHTML=F.length&&showF?`<div class="flights">${F.map(x=>`<div class="fl ${x["類型"]==="回程"?"back":""}">
    <span class="k">${esc(x["類型"])}</span>
    <span class="rt"><b>${esc(x["起飛時間"])}</b><span class="ar">→</span><b>${esc(x["抵達時間"])}</b><span class="ap">${esc(x["出發機場"])} → ${esc(x["抵達機場"])}</span></span>
    <span class="no">${esc(x["航班"])}<br>${esc(fDate(x["類型"]))}${x["艙等"]?`<span class="cls">${esc(x["艙等"])}</span>`:""}</span></div>${trRow(x["類型"])}`).join("")}</div>`:"";
  const ended=k<=-T.n,al=[];
  const un=S("接送").filter(x=>!booked(x));if(un.length) al.push(`${un.map(x=>esc(x["類型"])).join("、")}接送尚未預約`);
  const unpaid=S("住宿").filter(h=>String(h["是否已付"]||"").trim()==="未付款");if(unpaid.length) al.push(`${unpaid.length} 間住宿尚未付款`);
  $("alert").innerHTML=!ended&&al.length?al.map(a=>`<span class="alert">${ICON.alert}${a}</span>`).join(" "):"";
  if(day===null) day=ti>=0?ti:0;
  $("tabbar").hidden=false;
  renderView();
}

function renderPlan(v){
  day=Math.min(day,T.n-1);
  const ti=todayIndex(),cur=T.days[day],items=dayItems(day),info=dayInfo(day);
  const h=cur.hotel,prev=day>0?T.days[day-1].hotel:null;
  let rem="";
  const wd=wxDay(day);
  if(wd&&wd.kind==="forecast"&&wd.max!=null){
    const umb=wd.pop!=null&&wd.pop>=50,cold=wd.min!=null&&wd.min<=5;
    rem+=`<div class="rrow"><span class="ic">${wIcon(wd.code)}</span><div class="main">${wText(wd.code)}，${r0(wd.min)}～${r0(wd.max)}°C${wd.pop!=null?`，降雨機率 ${r0(wd.pop)}%`:""}
      ${umb||cold?`<div class="sub">${[umb?"記得帶傘":"",cold?"早晚很冷，多穿一件":""].filter(Boolean).join("，")}</div>`:""}</div></div>`;
  }
  const trK=day===0?"去程":day===T.n-1?"回程":"",trX=trK?trOf(trK):null;
  const trHtml=trX?(()=>{const lk=trLinks(trX);return `<div class="rrow"><span class="ic">${ICON.car}</span><div class="main">${trK==="去程"?"去機場":"回家"}的機場接送 ${trChip(trX)}
    ${trX["預約來源"]?`<div class="sub">${trSrc(trX)}</div>`:""}${trX["備註"]?`<div class="sub">${esc(trX["備註"])}</div>`:""}${lk?`<div class="sub lks">${lk}</div>`:""}</div></div>`})():"";
  if(day===0) rem+=trHtml;
  if(h){
    const moving=prev&&prev["名稱"]!==h["名稱"],checkin=h._in&&+h._in.date===+cur.date;
    rem+=`<div class="rrow"><span class="ic">${ICON.bed}</span><div class="main">${moving?"今天換飯店，今晚住":"今晚住"}<span class="nm">${esc(h["名稱"])}</span>
      ${h["地址"]?`<div class="sub">${esc(h["地址"])}</div>`:""}
      ${checkin&&h._in.time?`<div class="sub">${esc(h._in.time)} 後可入住</div>`:""}
      ${moving?`<div class="sub">記得從${esc(prev["名稱"])}退房、帶走行李</div>`:""}
      ${checkin&&needPay(h)?`<div class="sub">入住時記得付款${h["費用"]?`：${esc(h["費用"])}`:""}</div>`:""}</div>
      ${mapBtn(h["地圖關鍵字"]||h["名稱"])}</div>`;
  } else if(day===T.n-1&&T.n>1){
    const r=S("航班").find(f=>f["類型"]==="回程");
    if(r) rem+=`<div class="rrow"><span class="ic">${ICON.plane}</span><div class="main">今天返台，<b>${esc(r["起飛時間"])}</b> ${esc(r["航班"])} 起飛<div class="sub">${esc(r["出發機場"])}${prev?`，記得從${esc(prev["名稱"])}退房`:""}</div></div></div>`;
  }
  if(day!==0) rem+=trHtml;
  items.filter(o=>o.x["訂位"]).forEach(o=>{rem+=`<div class="rrow"><span class="ic">${ICON.bell}</span><div class="main">${esc(o.x["訂位"])}<div class="sub">${esc(o.x["名稱"])}</div></div></div>`});

  let html=`<div class="days" role="tablist">${T.days.map((d,i)=>`<button class="day" role="tab" aria-selected="${i===day}" data-d="${i}" aria-label="第 ${i+1} 天 ${mdw(d.date)}">
    ${i===ti?'<span class="dot" title="今天"></span>':""}<span class="w">週${WK[d.date.getDay()]}</span><span class="n">${d.date.getDate()}</span><span class="p">${esc(dayInfo(i).short)}</span></button>`).join("")}</div>
    <div class="dayhead"><h2>${esc(info.title)}</h2>${wxChip(day)}</div>
    ${rem?`<section class="remind" aria-label="今天記得">${rem}</section>`:""}`;
  SECS.forEach(([k,label])=>{
    const g=items.filter(o=>o.p.sec===k);if(!g.length) return;
    html+=`<section class="sec"><h3>${label}</h3><ol class="tl">${g.map(({x,p})=>`<li class="it ${p.fixed?"fixed":"flex"}">
      <time>${p.fixed?esc(p.label):esc(k!=="free"&&p.label!==label?p.label:"")}</time><span class="rail" aria-hidden="true"></span>
      <div class="body"><div class="bd"><div class="tt">${esc(x["名稱"])}${x["類別"]?`<span class="k">${esc(x["類別"])}</span>`:""}</div>
      ${x["說明"]?`<p>${esc(x["說明"])}</p>`:""}${x["訂位"]?`<div class="resv">${ICON.bell}${esc(x["訂位"])}</div>`:""}
      ${x._tr?`<div class="resv ${booked(x._tr)?"ok":""}">${ICON.car}${booked(x._tr)?"接送已預約":"接送尚未預約"}</div>`:""}</div>
      ${mapBtn(x._q!==undefined?x._q:(x["地圖關鍵字"]||x["名稱"]))}</div></li>`).join("")}</ol></section>`;
  });
  html+=items.length?`<div class="legend"><span><i></i>固定時間</span><span><i class="o"></i>彈性安排</span></div>`:'<p class="empty">這天還沒有安排行程。</p>';
  v.innerHTML=html;
}
function renderStay(v){
  const hs=T.hotels;
  const stamp=(s,suf)=>s?`${mdw(s.date)}${s.time?` ${s.time} ${suf}`:""}`:"";
  v.innerHTML=`<h2 class="ptitle">住宿</h2>`+(hs.length?`<ul class="list">${hs.map(h=>{
    const nights=h._in&&h._out?Math.round((h._out.date-h._in.date)/DAY):0;
    return `<li class="hotel"><div class="tt">${esc(h["名稱"])}${nights>0?`<span class="k">${nights} 晚</span>`:""}</div>
    <div class="when2">${h["入住"]?`<span>入住 ${esc(stamp(h._in,"後")||h["入住"])}</span>`:""}${h["退房"]?`<span class="o">退房 ${esc(stamp(h._out,"前")||h["退房"])}</span>`:""}</div>
    ${h["地址"]?`<div class="addr">${esc(h["地址"])}</div>`:""}
    ${h["費用"]||h["預訂平台"]||h["是否已付"]?`<div class="pay">${h["費用"]?`<span><span class="lb">費用</span> ${esc(h["費用"])}</span>`:""}${h["預訂平台"]?`<span><span class="lb">訂房</span> ${esc(h["預訂平台"])}</span>`:""}${payChip(h)}</div>`:""}
    ${h["備註"]?`<p>${esc(h["備註"])}</p>`:""}${maps(h["地圖關鍵字"]||h["名稱"])}</li>`}).join("")}</ul>`:'<p class="empty">「住宿」分頁還沒有資料。</p>');
}
function renderList(v){
  const block=(t,L)=>L.length?`<h3 class="h3">${t}</h3><ul class="list">${L.map(x=>`<li><div class="tt">${esc(x["名稱"])}</div>${x["說明"]?`<p>${esc(x["說明"])}</p>`:""}${maps(x["地圖關鍵字"]||x["名稱"])}</li>`).join("")}</ul>`:"";
  v.innerHTML=`<h2 class="ptitle">口袋名單</h2>`+((block("美食",S("美食"))+block("購物",S("購物")))||'<p class="empty">還沒有口袋名單。</p>');
}
function renderNotes(v){
  const groups={};S("須知").forEach(x=>{const g=x["分類"]||"其他";(groups[g]=groups[g]||[]).push(x["內容"])});
  const W=D.weather;let wxh="";
  if(W&&!W.error&&W.days&&W.days.length){
    const anyF=W.days.some(d=>d.kind==="forecast"),allF=W.days.every(d=>d.kind==="forecast");
    wxh=`<h3 class="h3">${esc(W.city||T.city||"")}天氣</h3><div class="wgrid" style="grid-template-columns:repeat(${Math.min(W.days.length,7)},1fr)">${W.days.map((d,i)=>{
      const dt=T.days[i]?T.days[i].date:null,f=d.kind==="forecast";
      return `<div class="wcell">${dt?`週${WK[dt.getDay()]}<br>${md(dt)}`:""}${f?wIcon(d.code):WI.temp}<b>${d.max!=null?`${r0(d.min)}–${r0(d.max)}°`:"—"}</b>${f&&d.pop!=null?`<span class="rain">${r0(d.pop)}%</span>`:`<span>${f?"":"往年"}</span>`}</div>`}).join("")}</div>
      <p class="wcap">${allF?"每日天氣預報":anyF?"有預報的日子顯示天氣預報，其餘為往年同期平均":"往年同期平均氣溫（近 3 年），出發前 16 天內會自動換成每日預報"}，資料來源 Open-Meteo</p>`;
  } else if(W&&W.error==="nocity"){wxh=`<p class="empty">找不到「${esc(W.city)}」的天氣，請確認「設定」的城市名稱。</p>`}
  v.innerHTML=`<h2 class="ptitle">須知</h2>`+wxh+(cfg("天氣說明")?`<p class="empty" style="margin-top:8px">${esc(cfg("天氣說明"))}</p>`:"")
    +`<div class="notes">${Object.keys(groups).map(g=>`<h3>${esc(g)}</h3><ul>${groups[g].map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`).join("")}</div>`;
}
function renderView(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===tab));
  $("hero").classList.toggle("compact",tab!=="plan"&&!!D);
  $("flights").hidden=tab!=="plan";
  const v=$("app");if(!D||!T) return;
  ({plan:renderPlan,stay:renderStay,list:renderList,notes:renderNotes}[tab]||renderPlan)(v);
}

/* ---------- 登入與資料讀取 ---------- */
function setStatus(t){$("status").textContent=t}
function fmt(iso){const d=new Date(iso);return isNaN(d)?"":`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}
function clearHeader(){$("title").textContent="行程";$("dates").textContent="";$("when").textContent="";$("flights").innerHTML="";$("alert").innerHTML="";$("tabbar").hidden=true;document.title="行程"}
function showLogin(msg,isErr){
  D=null;T=null;clearHeader();setStatus("");$("refresh").hidden=true;$("logout").hidden=true;
  $("app").innerHTML=`<form class="msg login" id="loginForm"><b>請輸入密碼</b>
    <p class="${isErr?"err":""}">${esc(msg||"輸入一次後，這支手機會記住密碼，下次打開不用再輸入。")}</p>
    <input id="pw" class="pwin" type="password" autocomplete="current-password" aria-label="密碼" placeholder="密碼">
    <button class="btn p" type="submit">進入</button></form>`;
}
function showMsg(t,b){$("app").innerHTML=`<div class="msg"><b>${esc(t)}</b><p>${esc(b)}</p></div>`}
async function load(){
  if(loading) return;
  if(!/^https:\/\/script\.google\.com\//.test(API_URL)){showMsg("還沒設定資料來源","請把 Apps Script 部署網址貼到 index.html 的 API_URL。");return}
  const pw=ls.get(PW_KEY,"");if(!pw){showLogin();return}
  loading=true;
  if(!D){const c=ls.get(CACHE_KEY,null);if(c){D=c;renderShell()}}
  $("refresh").hidden=false;$("logout").hidden=false;$("refresh").disabled=true;setStatus("資料更新中…");
  try{
    const r=await fetch(API_URL+"?key="+encodeURIComponent(pw)+"&t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const data=await r.json();
    if(data.error==="auth"){ls.del(PW_KEY);ls.del(CACHE_KEY);showLogin("密碼錯誤，或密碼已經變更，請重新輸入。",true);return}
    if(data.error==="locked"){setStatus("嘗試次數過多，請 10 分鐘後再試");if(!D)showMsg("暫時無法登入","密碼錯誤次數過多，請 10 分鐘後再試。");return}
    if(data.error==="nopassword"){showMsg("尚未設定密碼","請管理者先在試算表的「存取設定」分頁設定密碼。");setStatus("");return}
    if(data.error) throw new Error(data.error);
    D=data;ls.set(CACHE_KEY,data);lastFetch=Date.now();renderShell();setStatus("資料更新時間 "+fmt(data.updated));
  }catch(e){
    if(D) setStatus("目前無法連線，顯示上次儲存的資料");
    else {showMsg("讀取資料失敗","請確認網路連線後，按「重新整理」再試一次。");setStatus("")}
  }finally{loading=false;$("refresh").disabled=false}
}
document.addEventListener("submit",e=>{if(e.target.id!=="loginForm")return;e.preventDefault();const v=($("pw").value||"").trim();if(!v)return;ls.set(PW_KEY,v);load()});
document.addEventListener("click",e=>{
  const t=e.target.closest(".tab");if(t){tab=t.dataset.v;ls.set(TAB_KEY,tab);renderView();window.scrollTo(0,0);return}
  const d=e.target.closest(".day");if(d){day=+d.dataset.d;renderView();return}
  if(e.target.id==="refresh"){load();return}
  if(e.target.id==="logout"){ls.del(PW_KEY);ls.del(CACHE_KEY);showLogin("已登出。");return}
});
function autoRefresh(){if(document.visibilityState==="visible"&&ls.get(PW_KEY,"")&&Date.now()-lastFetch>30000) load()}
document.addEventListener("visibilitychange",autoRefresh);
window.addEventListener("pageshow",e=>{if(e.persisted)autoRefresh()});
load();
</script>
</body>
</html>
